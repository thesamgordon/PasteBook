[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "entity", "migration"]

[dependencies]
actix-web = "4"
actix-cors = "0.7.1"
tokio = { version = "1", features = ["rt"] }
serde = { version = "1.0.228", features = ["derive"] }
flate2 = { version = "1.1.5", features = ["zlib"] }
chrono = { version = "0.4.42", features = ["serde"] }
rand = "0.9.2"
log = "0.4.28"
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros", "uuid", "chrono"] }
uuid = { version = "1.18.1", features = ["v4"] }
entity = { path = "entity" }
migration = { path = "migration" }
dotenv = { version = "0.15.0", optional = true }
anyhow = "1.0.100"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[features]
default = []
local-dev = ["dotenv"]

[[bin]]
name = "backend"
path = "src/main.rs"
